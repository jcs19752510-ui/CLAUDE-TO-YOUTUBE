<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BH;src:url(fonts/black-han-sans-korean-400-normal.woff2)}
@font-face{font-family:NK;font-weight:900;src:url(fonts/noto-sans-kr-korean-900-normal.woff2)}
@font-face{font-family:NK;font-weight:700;src:url(fonts/noto-sans-kr-korean-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:#0b1020;overflow:hidden;font-family:NK,sans-serif;font-weight:900;color:#fff;word-break:keep-all}
#root{position:absolute;inset:0;background:radial-gradient(1200px 800px at 85% 15%,#3a2a08 0%,#0b1020 60%),#0b1020;display:flex;flex-direction:column;padding:60px 110px 50px}
.bh{font-family:BH,NK,sans-serif;font-weight:400}
.yl{color:#ffd23f}.gr{color:#4ade80}.rd{color:#ff6b6b}.dim{color:#aab4cf}
@keyframes in{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes grow{from{width:0}to{width:var(--w)}}
@keyframes drop{from{opacity:0;transform:translateY(-300px) rotate(-6deg)}to{opacity:1;transform:rotate(var(--r,0deg))}}
.a{opacity:0;animation:in .7s ease forwards}.al{opacity:0;animation:inl .7s ease forwards}.ap{opacity:0;animation:pop .6s ease forwards}.dr{opacity:0;animation:drop .7s cubic-bezier(.3,1.3,.5,1) forwards}
.hd{font-family:BH;font-weight:400;font-size:96px;line-height:1.15;text-align:center;text-shadow:0 6px 0 #000a;margin-bottom:12px}
.sub{font-size:56px;text-align:center;color:#ffd23f;margin-bottom:10px;font-weight:900}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:34px;min-height:0}
.row{display:flex;gap:44px;align-items:stretch;justify-content:center}
.card{flex:1;background:#ffffff14;border:5px solid #ffffff33;border-radius:36px;padding:44px 36px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.card .t{font-size:64px;line-height:1.2}
.card .d{font-size:50px;line-height:1.3;color:#d6dcf0;font-weight:700}
.badge{font-weight:400;flex:none;width:110px;height:110px;border-radius:50%;background:#ffd23f;color:#111;font-family:BH;font-size:72px;display:flex;align-items:center;justify-content:center}
.line{display:flex;align-items:center;gap:40px;background:#ffffff14;border:5px solid #ffffff33;border-radius:36px;padding:26px 50px;font-size:62px;line-height:1.25}
.line .x{font-size:52px;font-weight:700;color:#d6dcf0}
.warn{border-color:#ff6b6b;background:#ff6b6b1a}
.ok{border-color:#4ade80;background:#4ade801a}
.big{font-size:80px;line-height:1.3;text-align:center}
.cap{font-size:54px;text-align:center;color:#ffd23f;font-weight:900}
.pill{display:inline-block;background:#ffd23f;color:#111;border-radius:70px;padding:10px 50px;font-size:56px}
.code{background:#050814;border:5px solid #ffd23f66;border-radius:30px;padding:40px 54px;font-size:50px;line-height:1.55;font-weight:700;white-space:pre-wrap;color:#e8ecfa}
.code .k{color:#ffd23f}.code .c{color:#7dd3fc}.code .m{color:#8893b3}
.ico{width:230px;height:230px}
.prog{height:60px;border-radius:30px;background:#ffffff22;overflow:hidden}
.prog i{display:block;height:100%;background:#ffd23f;border-radius:30px;animation:grow 1.6s ease .4s both}
.ft{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:36px;color:#7e89a8;font-weight:700}
</style></head><body><div id="root"></div>
<script>
const $=(s)=>document.getElementById(s);
let D=0;const d=(step=.35)=>{D+=step;return `style="animation-delay:${D.toFixed(2)}s"`};
const H=(t,s)=>`<div class="hd a">${t}</div>${s?`<div class="sub a" style="animation-delay:.2s">${s}</div>`:''}`;
const person=(c,hair)=>`<svg class="ico" viewBox="0 0 200 200"><circle cx="100" cy="68" r="38" fill="${c}"/><path d="M28 188c0-46 32-72 72-72s72 26 72 72z" fill="${c}"/>${hair||''}</svg>`;
const chk=`<svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="38" fill="#4ade80"/><path d="M22 41l12 12 25-27" stroke="#0b1020" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const warnI=`<svg width="130" height="130" viewBox="0 0 130 130"><path d="M65 8L124 114H6z" fill="#ff6b6b"/><rect x="59" y="42" width="12" height="40" rx="5" fill="#0b1020"/><circle cx="65" cy="97" r="7" fill="#0b1020"/></svg>`;
const steps=(arr)=>arr.map((x,i)=>`<div class="line al" ${d()}><div class="badge">${i+1}</div><div>${x[0]}${x[1]?`<div class="x">${x[1]}</div>`:''}</div></div>`).join('');
const warnBox=(t,s)=>`<div class="line warn ap" ${d(.3)} style="justify-content:center;flex-direction:column;text-align:center;padding:50px">${warnI}<div class="big" style="font-size:72px">${t}</div></div>${s?`<div class="cap a" ${d()}>${s}</div>`:''}`;
const C={
'1_01':{n:'콜드오픈_결과물3개',s:6,h:()=>H('말 몇 줄이면 이렇게 됩니다','코딩은 한 줄도 안 했어요')+`<div class="body"><div class="row"><div class="card ap" ${d()}><div class="bh yl" style="font-size:120px">7</div><div class="t">홍보 글</div><div class="d">일주일 치 파일</div></div><div class="card ap" ${d()}><div class="bh yl" style="font-size:120px">8</div><div class="t">문의 답변</div><div class="d">답변 초안 문서</div></div><div class="card ap" ${d()}><div class="bh yl" style="font-size:120px">1</div><div class="t">홈페이지</div><div class="d">가게 소개 한 장</div></div></div><div style="text-align:center" class="a" ${d(.4)}><span class="pill">말 몇 줄 → 홍보 글 7개 · 답변 8개 · 홈페이지 1장</span></div></div>`},
'1_02':{n:'연령대4인',s:6,h:()=>H('누구나 괜찮습니다','프로그램 설치할 줄만 아시면 돼요')+`<div class="body"><div class="row">${[['20대','첫 가게','#7dd3fc'],['30대','투잡','#a5b4fc'],['40대','매장 준비','#fca5a5'],['50대','퇴직 후 창업','#fcd34d']].map(p=>`<div class="card ap" ${d()}>${person(p[2])}<div class="bh yl" style="font-size:84px">${p[0]}</div><div class="t" style="font-size:56px">${p[1]}</div></div>`).join('')}</div></div>`},
'1_03':{n:'설명란안내',s:6,h:()=>H('설명란에 올려 뒀어요','영상을 멈추고 따라 하셔도 됩니다')+`<div class="body">${steps([['연습 자료'],['복사해서 붙일 문장'],['안전 체크리스트']])}<div class="cap a" ${d()}>설명란 확인 ▼</div></div>`},
'2_01':{n:'할일카드쌓임',s:7,h:()=>H('혼자 다 하느라','정작 가게는 못 돌본다')+`<div class="body" style="align-items:center;position:relative">${['홍보 글','문의 답장','주문 정리','홈페이지'].map((t,i)=>`<div class="line dr" ${d(.6)} style="--r:${[-3,2.5,-2,3][i]}deg;width:${900+i*0}px;justify-content:center;font-size:76px;margin-top:${i?-14:0}px;background:#1a2240"><span class="yl">□</span> ${t}</div>`).join('')}</div>`},
'2_02':{n:'세탭비교',s:7,h:()=>H('앱 안의 세 가지 기능','오늘은 코드 탭 하나만 씁니다')+`<div class="body"><div class="row">${[['챗','물어보기','내 파일은 안 봄'],['코워크','목표 맡기기','알아서 일하고 결과를 가져옴'],['코드','내 폴더에서 파일 만들고 고치기','오늘 쓰는 탭']].map((p,i)=>`<div class="card ap ${i==2?'ok':''}" ${d()}><div class="bh ${i==2?'gr':'yl'}" style="font-size:96px">${p[0]}</div><div class="t">${p[1]}</div><div class="d">${p[2]}</div></div>`).join('')}</div></div>`},
'2_03':{n:'요금제안내',s:6,h:()=>H('요금제 먼저 확인','금액은 공식 요금 페이지에서 직접')+`<div class="body"><div class="row"><div class="card ap" ${d()}><div class="bh yl" style="font-size:96px">챗</div><div class="t">무료 포함<br>모든 요금제</div></div><div class="card ap" ${d()}><div class="bh yl" style="font-size:96px">코드 · 코워크</div><div class="t">프로 이상<br>유료 요금제</div></div></div><div class="cap a" ${d()}>요금은 바뀔 수 있어요</div></div>`},
'2_04':{n:'가짜사이트경고',s:6,h:()=>H('설치는 공식 페이지에서만','주소를 꼭 확인하세요')+`<div class="body"><div class="line ok al" ${d()} style="font-size:56px"><span class="gr" style="font-size:90px">✓</span><div>공식 다운로드 페이지<div class="x">주소 줄을 확대해서 확인</div></div></div><div class="line warn al" ${d()} style="font-size:56px"><span class="rd" style="font-size:90px">✕</span><div>비슷한 이름의 다른 사이트<div class="x">여기서 받으면 안 됩니다</div></div></div></div>`},
'2_05':{n:'막히는3가지',s:7,h:()=>H('막히는 곳은 세 군데','이 외에 따로 설치할 건 없어요')+`<div class="body">${[['업그레이드 안내','유료 요금제가 필요하다는 뜻'],['온라인 로그인 안내','로그인 후 앱 다시 시작'],['윈도우 깃 안내','그때만 깃 설치']].map((p,i)=>`<div class="line al" ${d()}><div class="badge">${i+1}</div><div>${p[0]}<div class="x">→ ${p[1]}</div></div></div>`).join('')}</div>`},
'2_06':{n:'코드탭열림_준비끝',s:5,h:()=>`<div class="body" style="align-items:center"><div class="ap" ${d()}>${chk.replace('80','260').replace('80','260')}</div><div class="hd a" ${d()} style="font-size:120px">코드 탭이 열렸다면<br><span class="yl">준비 끝</span></div></div>`},
'3_01':{n:'폴더만들기2단계',s:6,h:()=>H('첫 요청은 5분이면 끝','바탕화면에서 시작')+`<div class="body">${steps([['새 폴더 만들기','이름은 내사업'],['상품정보 파일 넣기','설명란에서 받은 연습 자료']])}</div>`},
'3_02':{n:'시작전확인3가지',s:7,h:()=>H('시작하기 전에 세 가지','코드 탭 입력창 주변')+`<div class="body"><div class="row">${[['환경','Local','내 컴퓨터에서 일하기'],['폴더 선택','내사업','전용 폴더 하나만'],['권한 모드','Manual','하나씩 확인하고 허락']].map(p=>`<div class="card ap" ${d()}><div class="t yl">${p[0]}</div><div class="bh" style="font-size:80px">${p[1]}</div><div class="d">${p[2]}</div></div>`).join('')}</div></div>`},
'3_03':{n:'허락전엔안바뀐다',s:5,h:()=>H('변경 제안 화면')+`<div class="body"><div class="row"><div class="card ok ap" ${d()}><div class="bh gr" style="font-size:90px">Accept</div><div class="t">괜찮으면 허락</div></div><div class="card warn ap" ${d()}><div class="bh rd" style="font-size:90px">Reject</div><div class="t">마음에 안 들면 거절</div></div></div><div class="cap a" ${d()} style="font-size:68px">허락하기 전엔 파일이 바뀌지 않는다</div></div>`},
'3_04':{n:'지침서4규칙',s:7,h:()=>H('업무 지침서 = 우리 가게 규칙','한 번 적어 두면 매번 설명 안 해도 된다')+`<div class="body" style="gap:24px">${[['존댓말을 쓴다'],['가격은 상품정보 그대로'],['과장 표현은 쓰지 않는다'],['모르면 지어내지 말고 질문']].map((p,i)=>`<div class="line al" ${d()} style="padding:16px 50px"><div class="badge" style="width:90px;height:90px;font-size:58px">${i+1}</div>${p[0]}</div>`).join('')}</div>`},
'3_05':{n:'안전3가지',s:8,h:()=>H('안전 약속 세 가지')+`<div class="body">${steps([['처음엔 Manual','바뀌는 내용을 눈으로 확인'],['내 폴더 하나만','문서 폴더 전체를 주지 않기'],['비밀번호·결제 정보·고객 실명은 넣지 않기','폴더에도 채팅에도']])}</div>`},
'4_01':{n:'10분체크포인트',s:7,h:()=>H('10분 체크포인트','가장 어려운 부분은 끝났다')+`<div class="body"><div class="row" style="gap:30px">${['설치','첫 실행','지침서'].map(t=>`<div class="line ok ap" ${d()} style="font-size:64px">${t} <span class="gr">✓</span></div>`).join('')}</div><div style="margin-top:20px"><div class="prog" style="--w:${10/27*100}%"><i style="--w:${10/27*100}%"></i></div><div class="cap" style="margin-top:20px;font-size:64px">10 / 27분</div></div></div>`},
'4_02':{n:'요청3칸구조',s:7,h:()=>H('요청은 세 칸만 채우세요')+`<div class="body"><div class="row">${[['무엇을','만들지'],['몇 개·어떤 모양으로','7개, 파일로'],['지킬 기준','가격 그대로, 지침서 규칙']].map((p,i)=>`<div class="card ap" ${d()}><div class="badge">${i+1}</div><div class="t yl">${p[0]}</div><div class="d">${p[1]}</div></div>`).join('')}</div></div>`},
'4_03':{n:'AcceptEdits안내',s:6,h:()=>H('파일이 여러 개라면')+`<div class="body"><div class="row" style="align-items:center"><div class="card ap" ${d()}><div class="bh" style="font-size:84px">Manual</div></div><div class="bh yl ap" ${d()} style="font-size:100px">→</div><div class="card ok ap" ${d()}><div class="bh gr" style="font-size:84px">Accept edits</div></div></div><div class="cap a" ${d()}>내 전용 폴더일 때만</div></div>`},
'4_04':{n:'확인3개',s:7,h:()=>H('올리기 전에 직접 확인','최종 책임은 사장님')+`<div class="body">${[['가격이 같은가','상품정보와 비교'],['알레르기·재료 표현이 맞는가',''],['과장 표현은 없는가','몸에 좋다·최고 등']].map((p,i)=>`<div class="line al" ${d()}><div style="flex:none">${chk}</div><div>${p[0]}${p[1]?`<div class="x">${p[1]}</div>`:''}</div></div>`).join('')}</div>`},
'4_05':{n:'올리는건내가직접',s:5,h:()=>`<div class="body" style="align-items:center"><div class="hd a" style="font-size:110px">클로드는 <span class="yl">초안</span>을 만든다</div><div class="hd a" ${d(.6)} style="font-size:110px">올리는 건 <span class="yl">내가 직접</span></div></div>`},
'5_01':{n:'개인정보경고',s:7,h:()=>H('실제 고객 정보는 그대로 넣지 않기')+`<div class="body">${warnBox('실명 · 전화번호 · 주소','')}<div class="row" ${d(.3)} style="align-items:center"><div class="line warn" style="font-size:60px">김OO 010-…</div><div class="bh yl" style="font-size:90px">→</div><div class="line ok" style="font-size:60px">고객A · 고객B</div></div></div>`},
'5_02':{n:'지어내지말기',s:6,h:()=>H('없는 내용은 지어내지 않게')+`<div class="body"><div class="line ok al" ${d()} style="font-size:56px"><div class="gr bh" style="font-size:64px">상품정보에 있으면</div>→ 그 사실만 쓰기</div><div class="line warn al" ${d()} style="font-size:56px"><div class="rd bh" style="font-size:64px">없으면</div>→ “확인 후 안내드리겠습니다”</div></div>`},
'5_03':{n:'보내기전에내가읽기',s:6,h:()=>H('이런 답변은 초안일 뿐','보내기 전에 내가 직접 읽기')+`<div class="body"><div class="row">${['알레르기','금액','환불'].map(t=>`<div class="card warn ap" ${d()}><div class="bh rd" style="font-size:84px">${t}</div><div class="d">직접 확인</div></div>`).join('')}</div></div>`},
'5_04':{n:'정답카드',s:8,h:()=>H('정답 카드','주문 14건 중 취소 2건 제외')+`<div class="body" style="gap:22px"><div class="line ok ap" ${d()} style="justify-content:center;font-size:84px"><span class="bh">12건 · 총매출</span><span class="bh yl">239,000원</span></div>${[['버터쿠키','12개','78,000원'],['말차쿠키','5개','35,000원'],['선물세트','7개','126,000원']].map(p=>`<div class="line al" ${d()} style="justify-content:space-between;padding:16px 60px;font-size:64px"><span>${p[0]}</span><span>${p[1]}</span><span class="yl">${p[2]}</span></div>`).join('')}</div>`},
'5_05':{n:'검산습관',s:5,h:()=>H('돈 숫자는 한 번 더')+`<div class="body" style="align-items:center"><div class="line ok ap" ${d()} style="font-size:84px;justify-content:center">계산기 · 엑셀로 검산</div><div class="cap a" ${d()}>이 습관 하나가 실수를 크게 줄입니다</div></div>`},
'6_01':{n:'20분전환',s:7,h:()=>H('20분 지점','마지막 실전: 홈페이지')+`<div class="body"><div class="row" style="gap:30px">${['홍보 글','문의·주문'].map(t=>`<div class="line ok ap" ${d()} style="font-size:64px">${t} <span class="gr">✓</span></div>`).join('')}</div><div><div class="prog"><i style="--w:${20/27*100}%"></i></div><div class="cap" style="margin-top:20px;font-size:64px">20 / 27분</div></div></div>`},
'6_02':{n:'Plan먼저',s:6,h:()=>H('큰 일은 Plan 먼저')+`<div class="body"><div class="line ap" ${d()} style="justify-content:center;font-size:90px"><span class="bh yl">Plan</span> 모드</div><div class="cap a" ${d()} style="font-size:60px">계획만 보여 주고 파일은 건드리지 않는다</div><div class="cap a" ${d()} style="color:#fff">승인하기 전에는 아무것도 바뀌지 않아요</div></div>`},
